[project]
name = "news-intel-pipeline"
version = "0.1.0"
description = "Event-driven news ingestion and LLM-powered filtering/analysis pipeline (FastAPI, Kafka, PostgreSQL)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Niall Krebs-Taylor" }]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "langchain",
    "langchain-openai",
    "langchain-community",
    "python-dotenv",
    "sqlalchemy",
    "psycopg2-binary",
    "pydantic-settings",
    "requests",
    "feedparser",
    "apscheduler",
    "pydantic[email]",
    "kafka-python",
    "beautifulsoup4>=4.12.0",
    "pyyaml>=6.0",
    "newspaper3k>=0.2.8",
    "lxml_html_clean>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
]
