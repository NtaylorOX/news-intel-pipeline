[project]
name = "news-project"
version = "0.1.0"
description = "A news analysis platform using AI."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "langchain",
    "langchain-openai",
    "langchain-community",
    "python-dotenv",
    "sqlalchemy",
    "psycopg2-binary",
    "pydantic-settings",
    "requests",
    "feedparser",
    "apscheduler",
    "pydantic[email]",
    "kafka-python",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "beautifulsoup4>=4.12.0",
    "pyyaml>=6.0",
    "newspaper3k>=0.2.8",
    "lxml_html_clean>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
dev-dependencies = []
