version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: news_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-news_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - news_network

  # Apache Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: news_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - news_network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: news_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "bash", "-c", "nc -z localhost 9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - news_network

  # API Service
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: news_api
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-news_db}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      PYTHON_ENV: ${PYTHON_ENV:-production}
    env_file:
      - .env
    networks:
      - news_network
    command: uvicorn services.api.main:app --host 0.0.0.0 --port 8000

  # Ingestion Service (News Fetcher + Scheduler)
  ingestion-worker:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    container_name: news_ingestion
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-news_db}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PYTHON_ENV: ${PYTHON_ENV:-production}
    env_file:
      - .env
    networks:
      - news_network
    command: python services/ingestion/main.py

  # Analysis Service (LLM-powered analysis)
  analysis-worker:
    build:
      context: .
      dockerfile: services/analysis/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-news_db}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      PYTHON_ENV: ${PYTHON_ENV:-production}
      ANALYSIS_BATCH_SIZE: ${ANALYSIS_BATCH_SIZE:-5}
    env_file:
      - .env
    networks:
      - news_network
    command: python services/analysis/main.py

  # Kafdrop - Kafka UI for monitoring topics, messages, and consumer groups
  kafdrop:
    image: obsidiandynamics/kafdrop:latest
    container_name: news_kafdrop
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:29092
      JVM_OPTS: "-Xms32M -Xmx64M"
      SERVER_SERVLET_CONTEXTPATH: "/"
    networks:
      - news_network

volumes:
  pgdata:
    driver: local

networks:
  news_network:
    driver: bridge