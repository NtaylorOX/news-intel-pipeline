[pytest]
# Pytest configuration file

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=app
    --cov=services
    --cov-report=term-missing
    --cov-report=html

# Markers for test categorization
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (slower, may use services)
    slow: Slow tests (mark with @pytest.mark.slow)
    api: API endpoint tests
    filtering: Content filtering tests
    deduplication: Duplicate detection tests
    ai: AI service tests

# Minimum version
minversion = 6.0
