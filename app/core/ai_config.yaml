# AI Model Configuration
# Settings for LLM provider and model parameters

provider: "openai"  # LLM provider: "openai"
model_name: "gpt-4o-mini"  # OpenAI model to use
temperature: 0.7  # Controls randomness (0.0 = deterministic, 1.0 = creative)
max_tokens: null  # Maximum tokens in response (null = no limit)

# Optional: Model-specific settings
# timeout: 30  # Request timeout in seconds
# top_p: 1.0  # Nucleus sampling parameter
# frequency_penalty: 0.0  # Reduce repetition
# presence_penalty: 0.0  # Encourage topic diversity
